<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cookie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 400;
        fill: #cbd5e1;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #93c5fd;
      }
      
      /* Background dynamic animated elements */
      @keyframes floatParticle1 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.1); opacity: 0.6; }
      }
      @keyframes floatParticle2 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.2; }
        50% { transform: translateY(18px) scale(0.9); opacity: 0.5; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes shieldScan {
        0% { transform: translateY(-30px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(30px); opacity: 0; }
      }

      .particle-1 { animation: floatParticle1 6s ease-in-out infinite; transform-origin: center; }
      .particle-2 { animation: floatParticle2 8s ease-in-out infinite; transform-origin: center; }
      .glow-bg { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .scanner-line { animation: shieldScan 3s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Animated Background Orbs -->
  <g opacity="0.6">
    <circle class="glow-bg" cx="150" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
    <circle class="glow-bg" cx="1050" cy="240" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Background Dynamic Mesh & Particles (Behind text) -->
  <g opacity="0.25">
    <circle class="particle-1" cx="920" cy="70" r="6" fill="#38bdf8" />
    <circle class="particle-2" cx="980" cy="140" r="10" fill="#818cf8" />
    <circle class="particle-1" cx="1060" cy="90" r="8" fill="#c084fc" />
    <circle class="particle-2" cx="1120" cy="180" r="5" fill="#f472b6" />
    <circle class="particle-1" cx="850" cy="220" r="7" fill="#38bdf8" />

    <!-- Connecting Grid Lines -->
    <path d="M 850 220 L 920 70 L 980 140 L 1060 90 L 1120 180" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  </g>

  <!-- Dynamic Cookie Shield Graphical Element (Right side) -->
  <g transform="translate(970, 150)">
    <!-- Outer Shield Frame -->
    <path d="M 0 -70 L 55 -40 V 20 C 55 55 0 80 0 80 C 0 80 -55 55 -55 20 V -40 Z" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.7"/>
    <!-- Animated Scanner Beam -->
    <line class="scanner-line" x1="-45" y1="0" x2="45" y2="0" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Cookie Icon inside Shield -->
    <circle cx="0" cy="-5" r="28" fill="url(#cookie-grad)" />
    <!-- Cookie Chocs -->
    <circle cx="-10" cy="-12" r="4" fill="#78350f" />
    <circle cx="10" cy="-15" r="3.5" fill="#78350f" />
    <circle cx="5" cy="5" r="4.5" fill="#78350f" />
    <circle cx="-12" cy="8" r="3" fill="#78350f" />
    <circle cx="14" cy="2" r="2.5" fill="#78350f" />
  </g>

  <!-- Foreground Content Container (Guaranteed Clear & Visible) -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="6" fill="#22c55e"/>
      <text x="32" y="21" class="badge-text">GDPR • CCPA • ePrivacy • GPC</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome Cookie Compliance</text>

    <!-- Gradient Accent Sub-title / Line -->
    <rect x="0" y="152" width="580" height="4" rx="2" fill="url(#accent-grad)" />

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">Curated Directory of Top SaaS &amp; Open-Source Consent Platforms</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 235)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="30" rx="8" fill="#334155" opacity="0.6"/>
      <text x="14" y="20" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">🍪 Consent Mode v2</text>
      
      <!-- Tag 2 -->
      <rect x="145" y="0" width="125" height="30" rx="8" fill="#334155" opacity="0.6"/>
      <text x="159" y="20" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">⚡ Auto-Blocking</text>

      <!-- Tag 3 -->
      <rect x="280" y="0" width="135" height="30" rx="8" fill="#334155" opacity="0.6"/>
      <text x="294" y="20" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">🔒 IAB TCF v2.3</text>
      
      <!-- Tag 4 -->
      <rect x="425" y="0" width="120" height="30" rx="8" fill="#334155" opacity="0.6"/>
      <text x="439" y="20" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">🚀 Self-Hosted</text>
    </g>
  </g>
</svg>
